{% extends "base.html" %}

{% block title %}Autor hinzufügen{% endblock %}

{% block content %}

<div class="card">

    <h1>👤 Neuen Autor hinzufügen</h1>

    <form action="{{ url_for('add_author') }}" method="POST">

        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="birthdate">Geburtsdatum</label>
            <input type="date"
                   id="birthdate"
                   name="birthdate"
                   required>
        </div>

        <div class="form-group">
            <label for="date_of_death">Sterbedatum (optional)</label>
            <input type="date"
                   id="date_of_death"
                   name="date_of_death">
        </div>

        <button type="submit">Autor hinzufügen</button>

    </form>

</div>

{% endblock %}
